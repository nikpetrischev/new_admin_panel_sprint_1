[flake8]
show-source = true
statistics = false
max-imports = 20
max-line-length = 119
max-complexity = 6
exclude = 
    .git,
    __pycache__,
    .venv,
    .eggs,
    *.egg,
    *migrations*,
    */config/components/*.py,
per-file-ignores = 
    __init__.py:
        F401,
extend-ignore = 
    E203,
    W503,
